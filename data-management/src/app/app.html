
<div class="container">
  <h1>Data Management System</h1>
  <p>Cascading Dropdown List</p>

  <!-- Provinsi -->
  <div class="form-group">
    <label for="province">Provinsi</label>

    <select
      id="province"
      [(ngModel)]="selectedProvince"
      (ngModelChange)="onProvinceChange()">

      <option [ngValue]="null">Pilih Provinsi</option>

      @for (province of provinces; track province.id) {
        <option [ngValue]="province.id">
          {{ province.name }}
        </option>
      }
    </select>
  </div>

  <!-- Kabupaten / Kota -->
  <div class="form-group">
    <label for="city">Kabupaten / Kota</label>

    <select
      id="city"
      [(ngModel)]="selectedCity"
      (ngModelChange)="onCityChange()"
      [disabled]="selectedProvince === null">

      <option [ngValue]="null">Pilih Kabupaten/Kota</option>

      @for (city of cities; track city.id) {
        <option [ngValue]="city.id">
          {{ city.name }}
        </option>
      }
    </select>
  </div>

  <!-- Kecamatan -->
  <div class="form-group">
    <label for="district">Kecamatan</label>

    <select
      id="district"
      [(ngModel)]="selectedDistrict"
      [disabled]="selectedCity === null">

      <option [ngValue]="null">Pilih Kecamatan</option>

      @for (district of districts; track district.id) {
        <option [ngValue]="district.id">
          {{ district.name }}
        </option>
      }
    </select>
  </div>

  <!-- Hasil alamat -->
  @if (selectedDistrict !== null) {
    <div class="result">
      <h3>Alamat Terpilih</h3>
      <p>{{ selectedProvinceName }}</p>
      <p>{{ selectedCityName }}</p>
      <p>{{ selectedDistrictName }}</p>
    </div>
  }
</div>

<!-- Employee Management -->
<app-bulk-table />
